    <meta charset="UTF-8" />

    <title>Profi | L'Excellence Éducative par IA</title>
    
    <!-- 1. Polyfills Environment (Basique pour Supabase) -->
    <script>
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' },
        version: '',
        cwd: function() { return '/'; },
        nextTick: function(callback) { setTimeout(callback, 0); }
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
    
    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.4);
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        margin: 0;
        overflow-x: hidden;
      }

      /* Background Animé "Aurora" */
      .blob {
        position: absolute;
        filter: blur(80px);
        z-index: -1;
        opacity: 0.6;
        animation: float 10s infinite ease-in-out;
      }
      .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #4f46e5; animation-delay: 0s; }
      .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: #c026d3; animation-delay: -5s; }
      .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #0ea5e9; animation-delay: -2s; opacity: 0.4; }

      @keyframes float {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      /* Glassmorphism Classes */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

      /* --- PDF / PRINT STYLES --- */
      @media print {
        @page { size: A4; margin: 2cm; }
        
        body { 
            background: white !important; 
            font-size: 12pt;
            color: black !important;
        }

        /* HIDE UI */
        .blob, .glass-panel, .glass-card, header, footer, .no-print { display: none !important; }
        #root > div > div.print\:hidden { display: none !important; }
        
        /* SHOW PRINT CONTENT */
        #printable-area { 
            display: block !important; 
            position: relative !important;
            width: 100% !important;
        }

        /* Formatting */
        h1, h2, h3, h4 { color: black !important; page-break-after: avoid; }
        p, li { line-height: 1.5; orphans: 3; widows: 3; }
        .page-break { page-break-before: always; }
        .break-inside-avoid { break-inside: avoid; }
        
        /* Math Fixes */
        .katex { font-size: 1.1em; color: black !important; }
        svg { max-width: 100%; height: auto; }
      }
    </style>
