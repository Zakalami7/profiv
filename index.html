<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Najah IA | L'Excellence Éducative par IA</title>

    <!-- Polyfills Environment (Basique pour Supabase) -->
    <script>
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' },
        version: '',
        cwd: function() { return '/'; },
        nextTick: function(callback) { setTimeout(callback, 0); }
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
    <link rel="stylesheet" href="/styles/ministry-theme.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="/icon-192.svg">

    <style>
      :root {
        /* Ministry-inspired Color Palette */
        --primary-navy: #003087;
        --primary-royal: #0052cc;
        --primary-light: #e6f0ff;
        --success-green: #2e7d32;
        --warning-amber: #f57c00;
        --error-red: #d32f2f;
        --neutral-100: #ffffff;
        --neutral-200: #f8f9fc;
        --neutral-300: #e8eaf6;
        --neutral-400: #c5cbe3;
        --neutral-500: #757b96;
        --neutral-600: #3a4050;
        --neutral-700: #1a1e2e;
        --surface-primary: #ffffff;
        --surface-secondary: #f8f9fc;
        --border-color: #e8eaf6;
        --shadow-subtle: 0 2px 8px rgba(0, 48, 135, 0.08);
        --shadow-hover: 0 4px 12px rgba(0, 48, 135, 0.12);
        --font-primary-arabic: 'Tajawal', 'Noto Sans Arabic', sans-serif;
        --font-primary-latin: 'Roboto', 'Segoe UI', system-ui, sans-serif;
      }

      body {
        font-family: var(--font-primary-latin), sans-serif;
        background-color: var(--surface-secondary);
        color: var(--neutral-600);
        margin: 0;
        overflow-x: hidden;
      }

      [dir="rtl"] body {
        font-family: var(--font-primary-arabic), sans-serif;
      }

      /* Ministry Card Styles */
      .ministry-card {
        background: var(--surface-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: var(--shadow-subtle);
        padding: 24px;
        transition: all 0.2s ease;
      }

      .ministry-card:hover {
        box-shadow: var(--shadow-hover);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--surface-secondary); }
      ::-webkit-scrollbar-thumb { background: var(--neutral-400); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--primary-royal); }

      /* Print Styles */
      @media print {
        @page { size: A4; margin: 2cm; }

        body {
            background: white !important;
            font-size: 12pt;
            color: black !important;
        }

        .ministry-card {
            box-shadow: none;
            border: 1px solid #000;
        }

        .no-print {
            display: none !important;
        }

        h1, h2, h3, h4 { color: black !important; page-break-after: avoid; }
        p, li { line-height: 1.5; orphans: 3; widows: 3; }
        .page-break { page-break-before: always; }
        .break-inside-avoid { break-inside: avoid; }

        .katex { font-size: 1.1em; color: black !important; }
        svg { max-width: 100%; height: auto; }
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1",
    "remark-math": "https://esm.sh/remark-math@6.0.0?bundle",
    "rehype-katex": "https://esm.sh/rehype-katex@7.0.0?bundle",
    "katex": "https://esm.sh/katex@0.16.9",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7?bundle",
    "docx": "https://aistudiocdn.com/docx@^9.5.1",
    "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@^8.6.4"
  }
}
</script>
  </head>
  <body class="min-h-screen antialiased selection:bg-primary-navy selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
